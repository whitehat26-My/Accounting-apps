name: Deploy prototype to GitHub Pages

# The static DEMO build of apps/web: the screens with an in-browser sample
# backend. NOT the real system — the API and PostgreSQL cannot run on Pages.
#
# Published by pushing the build to the gh-pages BRANCH rather than through
# the Pages API: the workflow token may not CREATE a Pages site
# ("Resource not accessible by integration", run 30752175245), but creating
# a gh-pages branch auto-enables Pages with the classic branch source.

on:
  push:
    branches: [claude/emil-accounting-architecture-kqu1ay, main]
    paths: ['apps/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here: pnpm/action-setup reads `packageManager` from
      # package.json, and naming a second version is exactly the mismatch
      # it errors on.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build static demo
        run: pnpm --filter @emil/web build
        env:
          NEXT_PUBLIC_DEMO: '1'
          DEMO_BASE_PATH: /${{ github.event.repository.name }}
      - name: Disable Jekyll processing
        run: touch apps/web/out/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/out
          force_orphan: true
