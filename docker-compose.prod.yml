# The whole system on one machine: PostgreSQL, migrations, the three
# services, and a nightly backup loop. See docs/DEPLOY.md for the runbook.
#
#   cp .env.prod.example .env.prod   # then fill in the four secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only `web` faces the internet: the browser calls /api/* and Next proxies to
# the API container, so the API and the database stay on the private network.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: emil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d emil']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: applies migrations as the postgres superuser — migration 0021
  # REFUSES any role that cannot bypass RLS, because the SECURITY DEFINER
  # functions it creates would otherwise silently see zero rows.
  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ['pnpm', '--filter', '@emil/db', 'migrate']
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/emil
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  # One-shot: creates/refreshes the two LOGIN roles the services connect as.
  # Re-running rotates their passwords to whatever .env.prod now holds.
  roles:
    image: postgres:16
    entrypoint: ['psql']
    command:
      - postgres://postgres:${POSTGRES_PASSWORD}@db:5432/emil
      - -v
      - app_password='${EMIL_APP_PASSWORD:?set EMIL_APP_PASSWORD in .env.prod}'
      - -v
      - worker_password='${EMIL_WORKER_PASSWORD:?set EMIL_WORKER_PASSWORD in .env.prod}'
      - -f
      - /prod-roles.sql
    volumes:
      - ./scripts/prod-roles.sql:/prod-roles.sql:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgres://emil_app_login:${EMIL_APP_PASSWORD}@db:5432/emil
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod (32+ chars)}
      # How many reverse-proxy hops sit in front of the API, so it trusts the
      # right X-Forwarded-For entry for the per-address rate limit. Empty means
      # trust nothing (client IP = the socket peer) — correct until a proxy is
      # in front. See .env.prod.example for the value this topology needs.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # The address printed as a QR code on every invoice, receipt, warranty
      # card and repair report, for a customer to check the document is real.
      # It must be the address THEY can reach — paper outlives the deployment
      # that printed it, and the localhost fallback below is a dead link in a
      # customer's hand. Set it in .env.prod before printing anything real.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${WEB_PORT:-8080}}
      # `invite` (default) or `open`. Passed through explicitly: compose gives
      # a container ONLY the variables named here, so a SIGNUP_MODE sitting in
      # .env.prod without this line would be silently ignored.
      SIGNUP_MODE: ${SIGNUP_MODE:-invite}
      # Optional: connects the in-app assistant. Empty means the assistant
      # honestly reports itself unconfigured; everything else still works.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Assistant questions per minute, per tenant. Capped tighter than other
      # routes because each one is a paid model call against the key above.
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-30}
      # Signs printed documents so their QR codes verify with this server
      # switched off — which is the only way a warranty card scanned years from
      # now can still be checked. Optional: without it, documents print the
      # older QR that points back here, exactly as they did before.
      # `node scripts/new-signing-key.mjs` emits this and its public half.
      # BACK IT UP WITH THE DATABASE. Changing it stops every document ALREADY
      # PRINTED from verifying, and no migration can reach paper.
      DOCUMENT_SIGNING_KEY: ${DOCUMENT_SIGNING_KEY:-}
      NODE_ENV: production
    depends_on:
      roles: { condition: service_completed_successfully }
    # Least privilege at the container boundary: no capabilities (Node binds a
    # high port, needs none) and no path to regain any through setuid binaries.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      # /openapi.json is unauthenticated and exercises the router.
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:3000/openapi.json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    environment:
      DATABASE_URL: postgres://emil_worker_login:${EMIL_WORKER_PASSWORD}@db:5432/emil
      NODE_ENV: production
    depends_on:
      roles: { condition: service_completed_successfully }
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # The name on the sign-in page and the browser tab — THIS instance's
        # own, not any one tenant's. A tenant's name and logo come from their
        # `organisation` row and appear once somebody has signed in; this is
        # what a person sees BEFORE that, when nobody knows whose books are
        # behind the address yet.
        #
        # A build arg, not an environment entry: Next inlines NEXT_PUBLIC_* at
        # build time. Changing it therefore needs `up -d --build`.
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Emil Books}
        # Baked into the route manifest by `next build`; see web.Dockerfile.
        # It must be here as well as below — the entry underneath reaches the
        # running container, which is far too late for a rewrite rule.
        API_ORIGIN: http://api:3000
    environment:
      API_ORIGIN: http://api:3000
    ports:
      - '${WEB_PORT:-8080}:3000'
    depends_on:
      api: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  # Nightly pg_dump, keeping the newest 14.
  #
  # SET `BACKUP_DIR` TO A ONEDRIVE OR GOOGLE DRIVE FOLDER. Left at the default
  # the dumps land next to the database, on the same disk, inside the same PC —
  # which protects against somebody deleting data in the app and against
  # nothing else. Not the disk failing, not the machine being stolen, not
  # ransomware. Both of those sync folders ship with Windows, cost nothing, and
  # need no extra tool, which turns "copy the backups off the machine" from
  # advice nobody follows into one line of configuration.
  backup:
    image: postgres:16
    entrypoint: ['sh', '-c']
    command:
      - |
        while true; do
          NEW="/backups/emil-$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump "postgres://postgres:$${POSTGRES_PASSWORD}@db:5432/emil" -Fc -f "$$NEW"; then
            # PROVE THE NEW DUMP IS READABLE BEFORE DELETING ANY OLD ONE.
            #
            # `pg_dump` exiting zero does not mean the archive can be restored:
            # a full disk, a killed container or a bad block can leave a file
            # that exists, looks plausible, and is refused by pg_restore. The
            # pruning used to run on pg_dump's exit code alone, so the one
            # night the dump was corrupt was also the night the last good
            # backups were deleted to make room for it.
            #
            # `pg_restore --list` reads the archive's table of contents without
            # writing anything anywhere. If it cannot, KEEP EVERYTHING: an
            # extra unreadable file costs a few megabytes, and the old dumps
            # are the entire point of having them.
            if pg_restore --list "$$NEW" > /dev/null 2>&1; then
              ls -1t /backups/emil-*.dump | tail -n +15 | xargs -r rm --
            else
              echo "BACKUP UNREADABLE: $$NEW failed pg_restore --list. Keeping all older dumps." >&2
            fi
          else
            echo "BACKUP FAILED: pg_dump did not complete. Keeping all older dumps." >&2
          fi
          sleep 86400
        done
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
